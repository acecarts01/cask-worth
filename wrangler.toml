name = "caskworth"
compatibility_date = "2025-01-01"
# Keep dashboard-set variables and secrets (RESEND_API_KEY, SESSION_SECRET,
# ADMIN_SETUP_TOKEN) when deploying from git; without this a deploy can wipe them.
keep_vars = true
main = "worker/index.js"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "caskworth-orders"
database_id = "39dda7a0-0c7d-4b6e-9969-2904441ace58"
