name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - '**/index.html'
      - 'products/**.html'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages to finish deploying
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, etc.)
        run: |
          KEY="caskworth2025indexnow9f3a7b2c"
          HOST="caskworth.com"

          RAW=$(curl -s "https://caskworth.com/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
          JSON_URLS=$(printf '%s\n' "$RAW" | awk 'BEGIN{ORS=""} {gsub(/"/,"\\\""); printf "%s\"%s\"", (NR>1?",":""), $0}')

          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://caskworth.com/${KEY}.txt\",\"urlList\":[${JSON_URLS}]}" \
            -w "\nIndexNow response HTTP %{http_code}\n"
