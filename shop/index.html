<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop All Premium Whisky | Caskworth</title>
<meta name="description" content="Browse our complete collection of premium bourbon, Scotch, Japanese, and rare allocated spirits. Same-day delivery available.">
<link rel="stylesheet" href="/assets/css/style.css?v=20260915b">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<script type="module">
  import { injectMetadata, injectSiteSchema } from '../assets/js/seo.js';
  import { initSearch } from '../assets/js/search-component.js';

  function initApp() {
    try {
      injectMetadata({
        title: "Shop All Premium Whisky | Caskworth",
        description: "Browse our complete collection of premium bourbon, Scotch, Japanese, and rare allocated spirits.",
        canonical: "https://caskworth.com/shop/",
        injectSiteSchema: true
      });
      initSearch();
    } catch (e) {
      console.error("Shop init failed:", e);
    }
  }

  if (document.readyState === 'complete') {
    initApp();
  } else {
    window.addEventListener('load', initApp);
  }
</script>
</head>
<body>
<header id="site-header">
  <div class="header-inner">
    <a href="/" class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#c9941a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <div class="logo-text"><b>Caskworth</b><small>Premium Whisky</small></div>
    </a>
    <nav class="site-nav">
      <a href="/" class="nav-link">Home</a>
      <a href="/shop/" class="nav-link active">Shop</a>
      <a href="/blog/" class="nav-link">Blog</a>
      <a href="/contact/" class="nav-link">Contact</a>
    </nav>
  </div>
</header>

<main id="main-content">
  <div class="page-hero">
    <div class="container">
      <nav class="breadcrumb"><a href="/">Home</a> › <span>Shop</span></nav>
      <h1>Premium Whisky Collection</h1>
      <p>Explore our curated selection of the world's finest spirits.</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="filter-wrap">
        <button class="ftab active" onclick="location.href='/shop/'">All</button>
        <button class="ftab" onclick="location.href='/shop/bourbon/'">Bourbon</button>
        <button class="ftab" onclick="location.href='/shop/scotch/'">Scotch</button>
        <button class="ftab" onclick="location.href='/shop/japanese/'">Japanese</button>
        <button class="ftab" onclick="location.href='/shop/allocated/'">Rare & Allocated</button>
      </div>
      
      <div id="shop-grid" class="products-grid">
        <!-- Products will be rendered by app.js or similar -->
      </div>
    </div>
  </section>
</main>

<footer id="site-footer">
  <!-- Standard Footer Content -->
</footer>

<script src="/assets/js/app.js" defer></script>
<script>
  window.addEventListener('load', () => {
    if (typeof PRODUCTS !== 'undefined' && typeof renderProducts === 'function') {
      renderProducts(PRODUCTS, "shop-grid");
    }
  });
</script>
</body>
</html>
